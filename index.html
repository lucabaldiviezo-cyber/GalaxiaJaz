<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amor de mi vida</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b071e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .html-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto !important;
        }
        .space-node {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .space-node:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE BIENVENIDA CON DESVANECIMIENTO EXTENDIDO (10 SEGUNDOS) -->
    <div id="welcome-screen" class="absolute inset-0 z-50 flex items-center justify-center bg-gradient-to-tr from-[#060411] via-[#0b071e] to-[#150a2b] opacity-0 transition-opacity duration-2000 ease-out">
        
        <!-- Luces de fondo cósmicas abstractas -->
        <div class="absolute w-[350px] h-[350px] bg-pink-500/10 rounded-full blur-[120px] top-1/4 left-1/3 animate-pulse"></div>
        <div class="absolute w-[300px] h-[300px] bg-purple-600/10 rounded-full blur-[100px] bottom-1/4 right-1/3"></div>

        <div class="max-w-md w-full text-center px-6 relative z-50 pointer-events-auto flex flex-col items-center">
            
            <!-- FOTO PRINCIPAL CON DISEÑO FLOTANTE Y NEÓN -->
            <div class="relative w-48 h-48 mb-8 flex items-center justify-center rounded-full p-[3px] bg-gradient-to-tr from-pink-500 via-purple-500 to-transparent shadow-[0_0_40px_rgba(236,72,153,0.3)] hover:shadow-[0_0_60px_rgba(236,72,153,0.5)] transition-all duration-700 group">
                <div class="w-full h-full bg-[#0b071e] rounded-full p-1">
                    <img src="https://i.postimg.cc/dtKgr9ht/Whats-App-Image-2026-06-04-at-15-11-13.jpg" alt="Nosotros" class="w-full h-full object-cover rounded-full filter grayscale-[20%] group-hover:grayscale-0 transition-all duration-700">
                </div>
                <!-- Icono de corazón flotante sutil -->
                <div class="absolute -bottom-1 -right-1 bg-[#0b071e] border border-pink-500/40 w-10 h-10 rounded-full flex items-center justify-center shadow-lg shadow-pink-500/20">
                    <i class="fa-solid fa-heart text-pink-500 text-base animate-pulse"></i>
                </div>
            </div>

            <!-- TÍTULO TIPOGRÁFICO ELEGANTE -->
            <h1 class="text-white text-3xl font-extralight tracking-[0.25em] uppercase mb-2">
                Te amo,amo <span class="font-medium text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">Jazmin</span>
            </h1>
            <div class="w-12 h-[1px] bg-gradient-to-r from-transparent via-pink-500/50 to-transparent mb-10"></div>
            
            <!-- BOTÓN INTERACTIVO ESTILO PREMIUM -->
            <button id="btn-iniciar" class="interactive relative z-50 bg-white/5 hover:bg-white/10 text-white font-light border border-white/20 hover:border-pink-500/60 px-12 py-3 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.4)] hover:shadow-[0_0_30px_rgba(236,72,153,0.3)] transition-all duration-300 uppercase tracking-[0.2em] text-xs cursor-pointer overflow-hidden group">
                <!-- Efecto de brillo interno al pasar el mouse -->
                <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-pink-500/10 to-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></span>
                <span class="relative z-10">Apretame</span>
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="html-overlay hidden">
        <div id="nodes-container" class="w-full h-full relative"></div>
    </div>

    <!-- VENTANA EMERGENTE (MODAL) -->
    <div id="modal" class="absolute inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-gradient-to-b from-[#25123e] to-[#120924] border-2 border-pink-500/40 rounded-3xl p-6 max-w-sm w-full text-center shadow-[0_0_40px_rgba(236,72,153,0.3)] m-4 interactive">
            
            <!-- CONTENEDOR DE FOTO DEL MOMENTO -->
            <div class="w-full h-48 rounded-2xl mb-4 overflow-hidden border border-purple-500/30 bg-purple-950/20 flex items-center justify-center">
                <img id="modal-img" src="" alt="Momento" class="w-full h-full object-cover">
            </div>

            <div class="flex items-center justify-center gap-2 mb-2">
                <div id="modal-icon" class="text-2xl">✨</div>
                <h2 id="modal-title" class="text-white text-2xl font-bold">Título</h2>
            </div>
            
            <p id="modal-text" class="text-pink-200 text-sm leading-relaxed mb-6">Este es el texto del mensaje de amor.</p>
            <button id="btn-cerrar" class="interactive bg-pink-500/20 hover:bg-pink-500/40 border border-pink-500/60 text-pink-200 font-medium px-6 py-1.5 rounded-full transition text-xs uppercase tracking-wider cursor-pointer">
                Cerrar
            </button>
        </div>
    </div>

    <script>
        // DATOS DE LOS PLANETAS
        const planetasData = [
            { id: 1, titulo: "Tu Sonrisa", texto: "Cuando sonreís algo dentro de mí también respira no se si es tu luz o en la forma en que haces que todo parezca menos complicado pero tu sonrisa tiene algo distinto algo que no solo se ve, se siente es como un lugar al que uno quiere volver cuando todo se vuelve gris. Me gusta tu sonrisa por que no promete nada pero aun así lo cambia todo porque cuando sonrías el mundo parece recordar que todavía hay razones para creer y sin darte cuenta te has vuelto mi forma favorita de ver la vida sonreír.", icono: "❤️", avatar: "💘", foto: "https://i.postimg.cc/VLCLLg3q/Whats-App-Image-2026-06-04-at-15-11-14.jpg" },
            { id: 2, titulo: "Mi Lugar Favorito", texto: "Mi lugar favorito en el universo es entre tus brazos. Ahí el tiempo se detiene y todo tiene sentido.", icono: "🌸", avatar: "🤍", foto: "https://i.postimg.cc/rmHjgqy2/Whats-App-Image-2026-06-04-at-15-11-14-(2).jpg" },
            { id: 3, titulo: "Mi amor", texto: "Aunque es probable que ya lo sepas, creo que es momento de confirmarlo, de confesarlo oficialmente, por algo dicen que al que no habla, Dios no lo oye, y yo quiero que me escuches, que lo entiendas, que se te quede grabado, quiero estar con vos, conocernos el resto de los años, estar en los momentos importantes y en los que estemos a punto de rendirnos, quiero merecer tu confianza, contagiarme de tu alegría, regalarte noches de paz, quiero estar con vos, con nadie más.", icono: "✨", avatar: "❣️", foto: "https://i.postimg.cc/Y9LYrYkM/Whats-App-Image-2026-06-04-at-15-11-17.jpg" },
            { id: 4, titulo: "Siempre Con Vos", texto: "No importa hacia dónde gire el mundo, mi brújula siempre marcará la dirección donde estés vos.", icono: "💗", avatar: "🎀", foto: "https://i.postimg.cc/G3kTXcpn/Whats-App-Image-2026-06-04-at-15-11-14-(3).jpg" },
            { id: 5, titulo: "Mi Casualidad", texto: "No pensaba volver a caer en el amor pero cuando vi que era con vos nadie tuvo que empujarme, yo me lancé.", icono: "💌", avatar: "💐", foto: "https://i.postimg.cc/mD1XvP59/Whats-App-Image-2026-06-04-at-15-11-19-(1).jpg" },
            { id: 6, titulo: "Te amo", texto: "Te amo con todo mi corazón, con lo bueno, con lo roto, con lo que soy y lo que estoy aprendiendo a ser. Te amo sin prisa pero sin pausa, sin miedo pero con profundidad. Te amo porque con vos descubrí un amor que no pesa, que no duele, que simplemente se siente correcto.", icono: "𝓙", avatar: "🖤", foto: "https://i.postimg.cc/BnrG7PNv/Whats-App-Image-2026-06-04-at-16-34-36.jpg" }
        ];

        const btnIniciar = document.getElementById('btn-iniciar');
        const welcomeScreen = document.getElementById('welcome-screen');
        const uiLayer = document.getElementById('ui-layer');
        const nodesContainer = document.getElementById('nodes-container');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalIcon = document.getElementById('modal-icon');
        const modalImg = document.getElementById('modal-img');
        const btnCerrar = document.getElementById('btn-cerrar');

        let scene, camera, renderer, controls;
        let galaxiaParticulas, corazonParticulas;
        let objetosOrbita = [];

        // LÓGICA DE ANIMACIONES

        // 1. Entrada lenta (2 segundos) al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                welcomeScreen.classList.remove('opacity-0');
                welcomeScreen.classList.add('opacity-100');
            }, 100);
        });

        // 2. Salida lenta (2 segundos) al presionar el botón
        btnIniciar.addEventListener('click', (e) => {
            e.preventDefault();
            
            welcomeScreen.classList.remove('opacity-100');
            welcomeScreen.classList.add('opacity-0');
            
            // Ajustado a 2000ms para coincidir con la clase duration-2000
            setTimeout(() => {
                welcomeScreen.remove();
                uiLayer.classList.remove('hidden');
                init3D();
                crearNodosHTML();
                animate();
            }, 2000);
        });

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b071e, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            const countParticulas = 12000;
            const geometriaGalaxia = new THREE.BufferGeometry();
            const posiciones = new Float32Array(countParticulas * 3);
            const colores = new Float32Array(countParticulas * 3);

            const colorCentro = new THREE.Color('#ff88cc');
            const colorBorde = new THREE.Color('#4411aa');

            for (let i = 0; i < countParticulas; i++) {
                const i3 = i * 3;
                const radio = Math.random() * 35;
                const brazosEspiral = 3;
                const anguloEspiral = ((i % brazosEspiral) / brazosEspiral) * Math.PI * 2 + radio * 0.15;

                const xRandom = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.4 * radio;
                const yRandom = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.4 * radio;
                const zRandom = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.4 * radio;

                posiciones[i3] = Math.cos(anguloEspiral) * radio + xRandom;
                posiciones[i3 + 1] = yRandom;
                posiciones[i3 + 2] = Math.sin(anguloEspiral) * radio + zRandom;

                const colorClonado = colorCentro.clone();
                colorClonado.lerp(colorBorde, radio / 35);
                colores[i3] = colorClonado.r;
                colores[i3 + 1] = colorClonado.g;
                colores[i3 + 2] = colorClonado.b;
            }

            geometriaGalaxia.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
            geometriaGalaxia.setAttribute('color', new THREE.BufferAttribute(colores, 3));

            const materialGalaxia = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            galaxiaParticulas = new THREE.Points(geometriaGalaxia, materialGalaxia);
            scene.add(galaxiaParticulas);

            const geometriaCorazon = new THREE.BufferGeometry();
            const posCorazon = [];
            
            for (let i = 0; i < 2000; i++) {
                const t = Math.PI * 2 * Math.random();
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                const z = (Math.random() - 0.5) * 10;
                
                posCorazon.push(x * 0.2, y * 0.2 + 8, z * 0.2);
            }
            
            geometriaCorazon.setAttribute('position', new THREE.Float32BufferAttribute(posCorazon, 3));
            const matCorazon = new THREE.PointsMaterial({
                color: 0xff33aa,
                size: 0.2,
                blending: THREE.AdditiveBlending
            });
            corazonParticulas = new THREE.Points(geometriaCorazon, matCorazon);
            scene.add(corazonParticulas);

            const nucleoGeo = new THREE.SphereGeometry(2, 32, 32);
            const nucleoMat = new THREE.MeshBasicMaterial({ color: 0x05020c });
            const nucleo = new THREE.Mesh(nucleoGeo, nucleoMat);
            scene.add(nucleo);

            planetasData.forEach((data, index) => {
                const angulo = (index / planetasData.length) * Math.PI * 2;
                const radioOrbita = 18 + index * 3;

                const dummy = new THREE.Object3D();
                dummy.userData = { 
                    radio: radioOrbita, 
                    angulo: angulo, 
                    velocidad: 0.01 + (index * 0.002),
                    id: data.id 
                };
                scene.add(dummy);
                objetosOrbita.push(dummy);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function crearNodosHTML() {
            planetasData.forEach(data => {
                const div = document.createElement('div');
                div.className = "space-node interactive flex flex-col items-center select-none";
                div.setAttribute('data-id', data.id);
                
                div.innerHTML = `
                    <div class="relative w-14 h-14 bg-[#1f1642]/90 border-2 border-pink-500/60 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(236,72,153,0.5)]">
                        <span class="text-2xl">${data.avatar}</span>
                        <div class="absolute -top-1 -right-1 bg-pink-500 text-[10px] w-5 h-5 rounded-full flex items-center justify-center text-white font-bold">${data.icono}</div>
                    </div>
                    <div class="mt-1 bg-black/60 px-2 py-0.5 border border-purple-500/30 rounded-md text-[10px] text-purple-200 font-semibold tracking-wider uppercase whitespace-nowrap">
                        ${data.titulo}
                    </div>
                `;

                div.addEventListener('click', () => abrirModal(data));
                nodesContainer.appendChild(div);
            });
        }

        function actualizarPosicionesNodos() {
            const tempV2 = new THREE.Vector3();
            
            objetosOrbita.forEach(dummy => {
                dummy.userData.angulo += dummy.userData.velocidad;
                dummy.position.x = Math.cos(dummy.userData.angulo) * dummy.userData.radio;
                dummy.position.z = Math.sin(dummy.userData.angulo * 0.01) * dummy.userData.radio; 
                dummy.position.y = Math.sin(dummy.userData.angulo * 2) * 2;

                dummy.updateMatrixWorld();
                tempV2.setFromMatrixPosition(dummy.matrixWorld);
                tempV2.project(camera);

                if(tempV2.z > 1) return;

                const x = (tempV2.x * .5 + .5) * window.innerWidth;
                const y = (tempV2.y * -.5 + .5) * window.innerHeight;

                const nodoHTML = document.querySelector(`.space-node[data-id="${dummy.userData.id}"]`);
                if (nodoHTML) {
                    nodoHTML.style.left = `${x}px`;
                    nodoHTML.style.top = `${y}px`;
                    const escala = 1 - (tempV2.z * 0.5);
                    nodoHTML.style.transform = `translate(-50%, -50%) scale(${Math.max(0.6, Math.min(1.1, escala))})`;
                }
            });
        }

        function abrirModal(data) {
            modalTitle.innerText = data.titulo;
            modalText.innerText = data.texto;
            modalIcon.innerText = data.icono;
            modalImg.src = data.foto;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        btnCerrar.addEventListener('click', () => {
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (galaxiaParticulas) galaxiaParticulas.rotation.y += 0.0015;
            if (corazonParticulas) {
                corazonParticulas.rotation.y -= 0.003;
                const tiempo = Date.now() * 0.003;
                const factorLatido = 1 + Math.sin(tiempo) * 0.05;
                corazonParticulas.scale.set(factorLatido, factorLatido, factorLatido);
            }

            controls.update();
            actualizarPosicionesNodos();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
